# Quality gates CI — GitHub Actions 模板
# 生成自 clean-code-gauntlet。占位符由 generate-project.sh 按语言从 quality-gates/tools/<语言>.yaml 注入。
# 阈值见 quality-gates/gates.yaml；工具与命令见 quality-gates/tools/<语言>.yaml（生成后即项目内实际映射表）。

name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  crap-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install {{CRAP_TOOL}}
        run: {{CRAP_INSTALL}}
      - name: CRAP gate（圈复杂度 ≤8 且 CRAP <30，见 gates.yaml）
        run: {{CRAP_CMD}}

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install {{MUTATE_TOOL}}
        run: {{MUTATE_INSTALL}}
      - name: Mutation gate（存活变异体 = 0）
        run: {{MUTATE_CMD}}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install {{COV_TOOL}}
        run: {{COV_INSTALL}}
      - name: Coverage gate（核心模块 ≥80%）
        run: {{COV_CMD}}

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install {{ARCH_TOOL}}
        run: {{ARCH_INSTALL}}
      - name: Architecture gate（依赖违规 = 0、循环依赖 = 0）
        run: {{ARCH_CMD}}
