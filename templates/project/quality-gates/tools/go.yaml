# 工具映射表 — Go
# 生成器读取本文件，把实际工具与命令注入 ci.yml 与 quality-gates 说明。
# 字段：<维度>_tool / <维度>_install / <维度>_cmd；architecture 另含 config 文件名。

language: go

crap_tool: crapper
crap_install: pipx install crapper
crap_cmd: crapper ./...

mutation_tool: mutator
mutation_install: pipx install mutator
mutation_cmd: mutator --source . --tests .

coverage_tool: go-cover
coverage_install: go version
coverage_cmd: go test -cover ./...

architecture_tool: go-arch-lint
architecture_install: go install github.com/fe3dback/go-arch-lint@latest
architecture_config: .go-arch-lint.yml
architecture_cmd: go-arch-lint

# 备选：arch-go（规则更宽：包内容/函数/命名规则；可作 go test 集成）
optional_tool: arch-go
optional_install: go install github.com/arch-go/arch-go@latest
optional_cmd: arch-go --json

# DRY 维度（可选）：dry4go（Bob Go 专用，已核验 README：--threshold 默认 0.82、--json、按函数/方法结构指纹比对）；dryer 多语言版亦支持 Go
dry_tool: dry4go
dry_install: go install github.com/unclebob/dry4go/cmd/dry4go@latest
dry_cmd: dry4go --json .

# 可选工具清单（社区备选，按需选用；主命令见上方 *_cmd，quality-check.sh 只跑主命令）
# 复杂度：gocyclo（圈复杂度单工具）
# 覆盖率：go test -coverprofile（内置，可出文件）
# 架构：arch-go（已列 optional；规则更宽，可集成 go test）
# DRY：dryer（Bob 多语言版，亦支持 Go）

note: "go-arch-lint 需 Go 1.25+；architecture_config 内声明 components 与 mayDependOn"
