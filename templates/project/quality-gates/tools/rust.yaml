# 工具映射表 — Rust
# 生成器读取本文件，把实际工具与命令注入 ci.yml 与 quality-gates 说明。
# 字段：<维度>_tool / <维度>_install / <维度>_cmd；architecture 另含 config 文件名。

language: rust

crap_tool: crapper
crap_install: pipx install crapper
crap_cmd: crapper src/

mutation_tool: mutator
mutation_install: pipx install mutator
mutation_cmd: mutator --source src --tests tests

coverage_tool: cargo-llvm-cov
coverage_install: cargo install cargo-llvm-cov
coverage_cmd: cargo llvm-cov --workspace

architecture_tool: cargo-archtest-cli
architecture_install: cargo install cargo-archtest-cli --force
architecture_config: architecture.json
architecture_cmd: cargo archtest

# 备选：cargo-modules（可视化 + 循环检测 + 孤儿文件）
optional_tool: cargo-modules
optional_install: cargo install cargo-modules
optional_cmd: cargo modules dependencies --lib --acyclic

# DRY 维度（可选）：dryer（Bob 多语言版，支持 Rust；已核验 README：函数与方法按结构指纹比对，跳过 mod tests 与闭包）
dry_tool: dryer
dry_install: 克隆 unclebob/dryer 到 tooling/vendor（首跑自动建 .venv）
dry_cmd: dryer --edn src/

note: "cargo-archtest-cli 支持 MayOnlyAccess/MayNotAccess/循环检测/外部 crate 白黑名单；architecture.json 声明 layer_names 与 access_rules"
