# 工具映射表 — Rust
# 生成器读取本文件，把实际工具与命令注入 ci.yml 与 quality-gates 说明。
# 字段：<维度>_tool / <维度>_install / <维度>_cmd；architecture 另含 config 文件名。

language: rust

crap_tool: crapper
crap_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
crap_cmd: <GAUNTLET_DIR>/tooling/vendor/crapper/crapper

mutation_tool: mutator
mutation_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
mutation_cmd: <GAUNTLET_DIR>/tooling/vendor/mutator/mutator

coverage_tool: cargo-llvm-cov
coverage_install: cargo install cargo-llvm-cov
coverage_cmd: cargo llvm-cov --workspace

architecture_tool: cargo-archtest-cli
architecture_install: cargo install cargo-archtest-cli --force
architecture_config: architecture.json
architecture_cmd: cargo archtest

# 备选：cargo-modules（可视化 + 循环检测 + 孤儿文件）
optional_tool: cargo-modules
optional_install: cargo install cargo-modules
optional_cmd: cargo modules dependencies --lib --acyclic

# DRY 维度（可选）：dryer（Bob 多语言版，支持 Rust；已核验 README：函数与方法按结构指纹比对，跳过 mod tests 与闭包）
dry_tool: dryer
dry_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
dry_cmd: <GAUNTLET_DIR>/tooling/vendor/dryer/dryer --edn src/

# 可选工具清单（社区备选，按需选用；主命令见上方 *_cmd，quality-check.sh 只跑主命令）
# 覆盖率：cargo-tarpaulin（cargo-llvm-cov 之外的主流）
# 变异：cargo-mutants（mutator 之外的 Rust 生态）
# 架构：cargo-modules（已列 optional；可视化 + 循环检测 + 孤儿文件）
# DRY：dryer 主选；暂无其他成熟 Rust DRY 工具

note: "cargo-archtest-cli 支持 MayOnlyAccess/MayNotAccess/循环检测/外部 crate 白黑名单；architecture.json 声明 layer_names 与 access_rules"
