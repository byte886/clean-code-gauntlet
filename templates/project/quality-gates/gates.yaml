# Quality Gates — 维度与阈值声明（语言无关）
# 只声明"查什么 + 阈值"；具体工具与命令见 tools/<语言>.yaml（生成器按语言注入）。
# 修改纪律：阈值改动必须同步本文件 + constitution/engineering.prompt + README.md。

维度:
  复杂度_CRAP:
    圈复杂度: { 阈值: "≤8", 说明: "Bob 对 Agent 的放宽阈值；人类标准 ≤4" }
    CRAP分:  { 阈值: "<30", 说明: "≥30 高风险，必须重构或补测试" }
  覆盖率:
    行覆盖: { 阈值: "核心模块 ≥80%，其余 ≥60%", 说明: "可按项目调整" }
  变异测试:
    存活变异体: { 阈值: "=0", 说明: "允许交接的唯一标准；等价变异体人工标注后可跳过" }
  架构依赖:
    依赖违规: { 阈值: "=0", 说明: "依赖方向只允许高层→低层" }
    循环依赖: { 阈值: "=0", 说明: "A→B→A 死结，任何循环都必须打破" }

# 可选维度（按需启用）
可选维度:
  DRY重复代码: { 说明: "dryer（Bob 多语言版，覆盖 TS/Go/Rust/Python）或 dry4go（Go 专用）；命令见各语言映射表 dry_* 字段，quality-check.sh --with-dry 启用" }
