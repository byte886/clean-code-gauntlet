mutation_cmd: /Users/wenjiechen/Doubao/skills/clean-code-gauntlet/tooling/vendor/mutator/mutator

coverage_tool: vitest
coverage_install: npm i -D vitest @vitest/coverage-v8
coverage_cmd: npx vitest run --coverage

architecture_tool: dependency-cruiser
architecture_install: npm i -D dependency-cruiser
architecture_config: .dependency-cruiser.cjs
architecture_cmd: npx depcruise --validate .dependency-cruiser.cjs src

# 可选增强：archlint（Rust 实现的 TS 架构探测器，28+ detectors：循环依赖/上帝模块/层违规）
optional_tool: archlint
optional_install: npm i -D archlint
optional_cmd: npx archlint check src

# DRY 维度（可选）：dryer（Bob 多语言版，支持 TypeScript；已核验 README：Jaccard 结构指纹 + --threshold/--edn/--min-lines）
dry_tool: dryer
dry_install: bash /Users/wenjiechen/Doubao/skills/clean-code-gauntlet/tooling/bin/install-tools.sh && bash /Users/wenjiechen/Doubao/skills/clean-code-gauntlet/tooling/bin/patch-treesitter.sh
dry_cmd: /Users/wenjiechen/Doubao/skills/clean-code-gauntlet/tooling/vendor/dryer/dryer --edn src/

