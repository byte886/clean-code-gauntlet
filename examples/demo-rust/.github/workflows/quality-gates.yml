# Quality gates CI — GitHub Actions 模板
# 生成自 clean-code-gauntlet。
# 设计说明（落地 3 实测修正）：
#   · crapper/mutator/dryer 无 PyPI 包，需 vendor 克隆；CI 环境可直连 GitHub，
#     因此在 CI 内联克隆到 ./.gauntlet/（无需 install-tools.sh，它依赖本地仓库根）。
#   · 本机一键质检用 quality-check.sh（读 quality-gates/tools/<语言>.yaml 的 *_cmd）。
#   · 覆盖率/架构工具是 pip/npm/cargo 包，仍由 {{COV_*}}/{{ARCH_*}} 按语言注入。

name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  crap-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install crapper（vendor 模式，首跑自动建 .venv）
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git .gauntlet/crapper
          cd .gauntlet/crapper && ./crapper --help
      - name: CRAP gate（圈复杂度 ≤8 且 CRAP <30，见 gates.yaml）
        run: ./.gauntlet/crapper/crapper

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mutator（vendor 模式；mutator 需 crapper 在相邻目录，且自用 .venv 跑 pytest）
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git .gauntlet/crapper
          git clone --depth 1 https://github.com/unclebob/mutator.git .gauntlet/mutator
          cd .gauntlet/mutator && ./mutator --help >/dev/null 2>&1 || true
          .venv/bin/pip install pytest coverage
      - name: Mutation gate（存活变异体 = 0；等价变异体人工核验后可豁免，见 EQUIVALENT-MUTANTS.md）
        run: |
          set +e
          ./.gauntlet/mutator/mutator
          code=$?
          set -e
          if [ $code -eq 3 ] && [ -f EQUIVALENT-MUTANTS.md ]; then
            echo "→ 存活变异体均已人工核验为等价变异体（EQUIVALENT-MUTANTS.md），豁免"
            exit 0
          fi
          exit $code

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Coverage gate（核心模块 ≥80%）
        run: cargo llvm-cov --workspace

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-archtest-cli
        run: cargo install cargo-archtest-cli --force
      - name: Architecture gate（依赖违规 = 0、循环依赖 = 0）
        run: cargo archtest
